<?xml version="1.0" encoding="UTF-8"?>
<!--
  Major — вариант 2: «Геометрическая монограмма с подчёркнутым углом».
  Концепция: толстая M из единого штриха-полилинии в стиле Linear/Notion,
  один угол V «надломлен» внутрь — даёт ощущение паллеты/коробки в перспективе.
  Минималистичный, без градиентов, идеален для печати и моно-цвета.
  Размер: 256×256.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
    <!-- Скруглённый фон-плашка (для иконки приложения) -->
    <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="#4F5BFF"/>

    <!-- M как единый stroke-path, скруглённые углы -->
    <!-- Левая ножка ↓, диагональ ↑, диагональ ↓, правая ножка ↑.
         Подчёркнутый «угол» внизу V даёт паллетный акцент. -->
    <path d="M 60 196
             L 60 60
             L 128 144
             L 196 60
             L 196 196"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="22"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Базовая «подложка-полка» под нижними углами M — едва заметная,
         даёт ощущение, что буква «стоит на полке». -->
    <rect x="48" y="200" width="160" height="6" rx="3" fill="#FFFFFF" opacity="0.45"/>
</svg>
